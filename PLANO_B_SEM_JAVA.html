<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plano B - Loja Escola (somente HTML)</title>
  <style>
    :root { --cor-principal: #b5121b; }
    body { margin:0; font:17px Arial,sans-serif; background:#f7f7fa; color:#242424; }
    header { padding:24px; background:var(--cor-principal); color:white; }
    main { max-width:820px; margin:auto; padding:20px; }
    .aviso { background:#fff1d3; border-left:5px solid #9b6a00; padding:14px; }
    .grade { display:flex; gap:14px; flex-wrap:wrap; }
    article { border-radius:10px; padding:16px; flex:1 1 180px; background:white; border:1px solid #ddd; }
    button { background:var(--cor-principal); border:0; padding:10px; border-radius:5px; color:white; cursor:pointer; }
  </style>
</head>
<body>
  <header><h1>Loja Escola (Plano B)</h1><p>Exemplo que abre mesmo sem Java ou internet.</p></header>
  <main>
    <p class="aviso"><b>ATENÇÃO:</b> este HTML é apenas uma maquete. Os produtos estão escritos no JavaScript: NÃO há API Java nem banco SQL nesta página.</p>
    <h2>Catálogo de exemplo</h2><div id="grade" class="grade"></div>
    <h2>Carrinho temporário</h2><p id="carrinho">Nenhum item adicionado.</p>
  </main>
  <script>
    const produtos = [
      {nome:'Camiseta',preco:39.90},
      {nome:'Caneca',preco:24.50},
      {nome:'Caderno',preco:18.00}
    ];
    let total = 0;
    const grade = document.getElementById('grade');
    produtos.forEach(produto => {
      const cartao=document.createElement('article');
      const titulo=document.createElement('h3');titulo.textContent=produto.nome;
      const preco=document.createElement('p');preco.textContent=produto.preco.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
      const botao=document.createElement('button');botao.textContent='Adicionar';
      botao.addEventListener('click',()=>{
        total+=produto.preco;
        document.getElementById('carrinho').textContent='Total de exemplo: '+total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
      });
      cartao.append(titulo,preco,botao);grade.append(cartao);
    });
  </script>
</body>
</html>
